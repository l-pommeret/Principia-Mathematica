name: Edition preview and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify the recorded printed readings
        run: python3 scripts/sync_item_printed.py --check
      - name: Aggregate preflight
        # This is the workflow that publishes to GitHub Pages, and it used to run
        # six hand-picked checks: no preflight, no dependency audit, no unit
        # tests.  The public artefact was built by the weakest gate set in the
        # repository.  It now runs the same aggregate everything else runs.
        run: python3 scripts/verify_preflight.py
      - name: Build and kernel-check the edition
        run: lake build
      - name: Audit the axioms of every certified declaration
        run: python3 scripts/verify_axiom_audit.py
      - name: Verify each proof follows its printed demonstration
        run: python3 scripts/verify_printed_citations.py --report-all
      - name: Build the reader edition
        run: python3 scripts/build_edition.py
      - name: Verify the reader edition
        run: python3 scripts/verify_site.py
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: principia-edition-${{ github.sha }}
          path: site/
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Package GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
