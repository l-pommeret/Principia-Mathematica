name: Lean fast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify gate integrity
        run: python3 scripts/verify_gate_integrity.py
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          # Only the toolchain is cached.  The previous key hashed
          # lean-toolchain, lakefile.toml and lake-manifest.json while caching
          # .lake/build — none of those three files changes when Lean sources
          # change, so the key was constant across the project's whole history
          # and `lake build` could report success from artefacts compiled from
          # different source.  A build cache must be keyed on the sources.
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-lean-fast-${{ hashFiles('lean-toolchain') }}
      - name: Fast global editorial invariants
        run: |
          python3 scripts/sync_item_printed.py --check
          python3 scripts/verify_editorial.py --report-all
          python3 scripts/verify_pm_parser_coverage.py
          python3 scripts/report_lean_source_coverage.py --verify-pipeline
      - name: Certification invariants
        # Unconditional, and deliberately not part of the changed-files step
        # below: a commit that only promotes metadata changes no Lean file, so
        # the differential kernel check runs nothing and would otherwise go
        # green while items are being certified.
        run: |
          python3 scripts/verify_certification_tier.py --check
          python3 scripts/verify_ci_evidence.py --report-all
          python3 scripts/verify_judgement_primitives.py --report-all
          python3 scripts/verify_lean_policy.py
      - name: Build aggregate
        # Must precede the per-file check below.  `lake env lean` elaborates one
        # file against whatever is already compiled, so a front that imports
        # `Principia.Syntax.Ramified` — which every derived chapter now does —
        # fails with `unknown module prefix 'Principia'` when nothing has been
        # built yet.  The step then reports a broken import instead of the
        # broken proof it exists to find.
        run: lake build
      - name: Kernel-check changed Lean fronts
        shell: bash
        run: |
          lake env lean --version
          # Compare against the merge base rather than HEAD^ so a pushed series
          # of commits, or a pull request with several commits, is covered in
          # full instead of only at its tip.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'Principia/*.lean' 'Principia/**/*.lean' \
            | tr '\n' '\0' \
            | xargs -0 -r -n 1 -P 4 lake env lean
