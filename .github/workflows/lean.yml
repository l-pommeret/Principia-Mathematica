name: Lean

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}
      - name: Aggregate source, dependency, and context preflight
        run: |
          python3 scripts/sync_item_printed.py
          python3 scripts/verify_preflight.py
      - name: Kernel-check every isolated elementary context
        shell: bash
        run: |
          # Resolve elan/Lake's toolchain metadata once before parallel worker
          # processes start.  A cold concurrent first lookup can race inside
          # elan and fail with its transient "missing key: version" error.
          lake env lean --version
          find aristotle/contexts -maxdepth 1 -name '*.lean' -print0 \
            | xargs -0 -n 1 -P 4 bash -c '
                context="$1"
                echo "Kernel-check $context"
                lake env lean "$context"
              ' _
      - name: Build and kernel-check the edition
        run: lake build
