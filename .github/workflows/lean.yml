name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and kernel-check the edition
        run: lake build
      - name: Reject placeholders and unsafe declarations
        run: |
          if grep -RInE --include='*.lean' '\b(sorry|admit)\b|unsafe[[:space:]]+(def|theorem)' Principia Principia.lean; then
            echo 'Forbidden Lean escape hatch found.' >&2
            exit 1
          fi
