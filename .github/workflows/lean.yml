name: Lean

# Previously `workflow_dispatch` only: nothing ran unless a human asked, so the
# claim that a proof is accepted only after Lean and CI checks rested on
# operator discipline alone.  Certification is now gated on every push and pull
# request to the default branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `verify_ci_evidence.py` resolves recorded commits with
          # `git cat-file` and `git merge-base --is-ancestor`, which need real
          # history rather than a depth-1 clone.
          fetch-depth: 0
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}
      - name: Aggregate source, dependency, and context preflight
        run: |
          # `--check`, never a bare run: a CI step that repairs metadata makes
          # every later gate validate CI's own output instead of the commit.
          python3 scripts/sync_item_printed.py --check
          python3 scripts/verify_preflight.py
      - name: Kernel-check every isolated elementary context
        shell: bash
        run: |
          # Resolve elan/Lake's toolchain metadata once before parallel worker
          # processes start.  A cold concurrent first lookup can race inside
          # elan and fail with its transient "missing key: version" error.
          lake env lean --version
          find aristotle/contexts -maxdepth 1 -name '*.lean' -print0 \
            | xargs -0 -n 1 -P 4 bash -c '
                context="$1"
                echo "Kernel-check $context"
                lake env lean "$context"
              ' _
      - name: Build and kernel-check the edition
        run: lake build
      - name: Audit the axioms of every certified declaration
        # Must follow `lake build`: this shells out to `lake env lean` on a file
        # that imports Principia, so it needs a populated .lake/build.
        run: python3 scripts/verify_axiom_audit.py
      - name: Audit every declaration of the object calculus, catalogued or not
        # The audit above asks only about declarations the catalogue references.
        # That left the widest hole in the standard: an infrastructure lemma
        # nothing catalogues yet can carry an axiom silently and hand it to
        # everything built above it. Seven declarations sat in that hole, and
        # the carrier was not a borrowed lemma but Lean's own structural
        # recursion compiler — `Nat.brecOn`, `OrderedFormula.brecOn` and the
        # generated matchers all depend on `propext`, so writing a plain `match`
        # is enough to acquire it. Only this step sees that.
        run: python3 scripts/verify_library_independence.py --report-all
      - name: Verify each proof follows its printed demonstration
        run: python3 scripts/verify_printed_citations.py --report-all
